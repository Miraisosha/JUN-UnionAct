name: Build

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: nuget restore UnionAct.sln

      - name: Build Solution
        run: msbuild UnionAct.sln /p:Configuration=Debug /p:Platform=x86
